<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<link rel="stylesheet" href="$root$style.css">
$if(highlighting-css)$
<style>
$highlighting-css$
</style>
$endif$
$math$
</head>
<body>
<!--NAV-->
<main>
$body$
</main>
<script>
// "Copier" button on every code block
document.querySelectorAll("pre").forEach(function (pre) {
  var box = pre.parentElement;
  if (!box.classList.contains("sourceCode")) {
    box = document.createElement("div");
    box.className = "codewrap";
    pre.parentNode.insertBefore(box, pre);
    box.appendChild(pre);
  }
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "copy-btn";
  btn.textContent = "Copier";
  btn.addEventListener("click", function () {
    var text = (pre.querySelector("code") || pre).textContent;
    var done = function () { btn.textContent = "Copié !"; setTimeout(function () { btn.textContent = "Copier"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { btn.textContent = "Erreur"; });
    } else {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Erreur"; }
      document.body.removeChild(ta);
    }
  });
  box.appendChild(btn);
});
</script>
<footer>Page générée automatiquement à partir des fichiers Markdown du dépôt (pandoc, MathJax).</footer>
</body>
</html>
